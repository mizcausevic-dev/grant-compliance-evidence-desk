<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09101d"/>
      <stop offset="100%" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#37ff8b"/>
      <stop offset="100%" stop-color="#19c7ff"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="26" y="26" width="1388" height="808" rx="24" fill="none" stroke="url(#line)" stroke-width="2"/>
  <text x="80" y="112" fill="#37ff8b" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Grant Compliance Evidence Desk</text>
  <text x="80" y="188" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700"><tspan x="80" dy="0">Grant readiness at a glance.</tspan></text>
  <text x="80" y="235" fill="#b9c9e6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400"><tspan x="80" dy="0">Active grants, missing evidence packets, and funder-facing deliverable risk</tspan><tspan x="80" dy="32">stay visible in one control surface.</tspan></text>
  <text x="80" y="270" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• 4 active grants with average readiness 77.2.</tspan></text><text x="80" y="358" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• 5 missing packets still need proof before closeout.</tspan></text><text x="80" y="446" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• Mobile classroom equipment award is currently the</tspan><tspan x="80" dy="38">highest-readiness lane for State Arts Trust.</tspan></text>
  <text x="80" y="790" fill="#9eb1d1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Synthetic proof render for README packaging.</text>
</svg>