  <text x="80" y="112" fill="#37ff8b" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Grant Compliance Evidence Desk</text>
  <text x="80" y="188" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700"><tspan x="80" dy="0">Reporting posture before</tspan><tspan x="80" dy="62">funder trust slips.</tspan></text>
  <text x="80" y="235" fill="#b9c9e6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400"><tspan x="80" dy="0">Deliverable risk, owner readiness, and evidence posture stay inspectable</tspan><tspan x="80" dy="32">before the next reporting window closes.</tspan></text>
  <text x="80" y="270" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• Max deliverable risk is 69 across the current portfolio.</tspan></text><text x="80" y="358" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• High-risk grants surface before late reporting becomes an</tspan><tspan x="80" dy="38">executive surprise.</tspan></text><text x="80" y="446" fill="#e9f3ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400"><tspan x="80" dy="0">• This lane is designed for hosted preview and embedded</tspan><tspan x="80" dy="38">nonprofit reporting modules.</tspan></text>
  <text x="80" y="790" fill="#9eb1d1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Synthetic proof render for README packaging.</text>
